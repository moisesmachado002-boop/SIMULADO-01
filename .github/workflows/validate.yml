name: Validate Mentor IA

on:
  push:
    branches: ["fix/stability-9-1", "main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check production entrypoints
        shell: python
        run: |
          import pathlib
          index = pathlib.Path('index.html').read_text(encoding='utf-8')
          wrapper = pathlib.Path('mentor-v431.html').read_text(encoding='utf-8')
          core = pathlib.Path('mentor-v4.html').read_text(encoding='utf-8')
          if 'mentor-v431.html' not in index:
              raise SystemExit('index.html is not pointing to mentor-v431.html')
          required = ['mentor-request-guard-v432.js','controls-v47.js','outside-study-v48.js','nav-layout-v49.js','resources-v49.js','study-timer-v410.js','feedback-coach-v411.js','overdue-lock-v415.js','question-elimination-v412.js','timer-review-manual-v416.js','subtopic-filters-v414.js','report-v422.js','qc-banks-v421.js','review-question-stats-v420.js','learning-history-v418.js','analytics-v423.js','pdf-export-v424.js','daily-goals-v428.js','daily-actions-v432.js','math-feedback-v429.js','priority-planner-v430.js','week-summary-v431.js']
          missing=[x for x in required if x not in wrapper]
          if missing: raise SystemExit('Missing production modules: '+', '.join(missing))
          for forbidden in ['plan-feasibility-v425.js','daily-mission-v427.js']:
              if forbidden in wrapper: raise SystemExit('Old mutating daily planner still loaded: '+forbidden)
          if 'mentor-v4.html' not in wrapper: raise SystemExit('production wrapper base missing')
          if 'intelligence-core-v4.5.js' not in core or 'v2.js' not in core: raise SystemExit('base loader incomplete')
          print('Production entrypoints validated')
      - name: Check stabilization invariants
        shell: python
        run: |
          import pathlib
          core=pathlib.Path('mentor-v4.html').read_text(encoding='utf-8')
          week=pathlib.Path('week-summary-v431.js').read_text(encoding='utf-8')
          daily_actions=pathlib.Path('daily-actions-v432.js').read_text(encoding='utf-8')
          guard=pathlib.Path('mentor-request-guard-v432.js').read_text(encoding='utf-8')
          for x in ['carregar dados não altera o cronograma','autoPlanOnLoad']:
              if x not in core: raise SystemExit('Read-only load invariant missing: '+x)
          for x in ['SOMENTE LEITURA','materialize_due_reviews_v432','Replanejar esta semana','rebuild_smart_week_v431']:
              if x not in week: raise SystemExit('Stable week invariant missing: '+x)
          for x in ['data-task-complete','data-task-review','data-task-bank','data-task-qc']:
              if x not in daily_actions: raise SystemExit('Daily action relay missing: '+x)
          for x in ['/functions/v1/mentor-analyze','inFlight','TTL_MS','cache','window.fetch']:
              if x not in guard: raise SystemExit('Mentor request guard missing: '+x)
          print('Stabilization invariants validated')
      - name: Check V4.28 daily goals
        shell: python
        run: |
          import pathlib
          daily=pathlib.Path('daily-goals-v428.js').read_text(encoding='utf-8')
          required=['apply_monitored_topic_policies_v428','Meta de hoje travada','weightedProgress','BLOCO CONJUNTO','1 POR VEZ','v428-hidden']
          missing=[x for x in required if x not in daily]
          if missing: raise SystemExit('V4.28 daily goals invariant missing: '+', '.join(missing))
          print('Daily goals V4.28 validated')
      - name: Check V4.29 math feedback
        shell: python
        run: |
          import pathlib
          f=pathlib.Path('math-feedback-v429.js').read_text(encoding='utf-8')
          required=['Resolução passo a passo','Comentários das alternativas','Conferência do gabarito','Gabarito ${esc(right)}','matematica']
          missing=[x for x in required if x not in f]
          if missing: raise SystemExit('V4.29 math feedback invariant missing: '+', '.join(missing))
          print('Math feedback V4.29 validated')
      - name: Check V4.30 priority planner
        shell: python
        run: |
          import pathlib
          p=pathlib.Path('priority-planner-v430.js').read_text(encoding='utf-8')
          required=['apply_smart_priorities_v430','Ordem inteligente ativa','PROVA PMBA','CONTINUIDADE','Um tópico do fim do edital não pula']
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit('V4.30 priority planner invariant missing: '+', '.join(missing))
          print('Priority planner V4.30 validated')
      - name: Check weekly summary
        shell: python
        run: |
          import pathlib
          w=pathlib.Path('week-summary-v431.js').read_text(encoding='utf-8')
          required=['Semana em modo estável','BLOCO CONJUNTO','1 POR VEZ','Total do dia','SOMENTE LEITURA']
          missing=[x for x in required if x not in w]
          if missing: raise SystemExit('Weekly invariant missing: '+', '.join(missing))
          print('Weekly summary validated')
      - name: Check analytics
        shell: python
        run: |
          import pathlib
          a=pathlib.Path('analytics-v423.js').read_text(encoding='utf-8')
          for x in ['Total de Questões Feitas','Por disciplina','Por assunto','Evolução por assunto','LEGACY_ZERO_DUVIDAS','v423WeekGrid']:
              if x not in a: raise SystemExit('Analytics invariant missing: '+x)
          print('Analytics validated')
      - name: Check PDF hotfix
        shell: python
        run: |
          import pathlib
          p=pathlib.Path('pdf-export-v424.js').read_text(encoding='utf-8')
          for x in ['jspdf/2.5.1/jspdf.umd.min.js','cdn.jsdelivr.net/npm/jspdf@2.5.1','mentor-download-binary','#r422Pdf']:
              if x not in p: raise SystemExit('PDF invariant missing: '+x)
          print('PDF validated')
      - name: Check report consolidation
        shell: python
        run: |
          import pathlib
          wrapper=pathlib.Path('mentor-v431.html').read_text(encoding='utf-8')
          for x in ['report-export-v417.js','report-export-v419.js','report-cleanup-v421.js']:
              if x in wrapper: raise SystemExit('Legacy report module loaded: '+x)
          report=pathlib.Path('report-v422.js').read_text(encoding='utf-8')
          for x in [".in('status',['pending','in_progress','completed'])",'pending_review_topics','active_plan_items']:
              if x not in report: raise SystemExit('Report invariant missing: '+x)
          print('Report consolidation validated')
