<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Mentor IA V4.31 — Estabilização</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f4f4f4;overflow:hidden}iframe{display:block;width:100%;height:100dvh;border:0;background:#f4f4f4}</style>
</head>
<body>
<iframe id="mentorFrame" title="Mentor IA"></iframe>
<script>
(() => {
  const BUILD='20260830-1925-v434-stable2';
  const frame=document.getElementById('mentorFrame');
  const modules=[
    ['mentorV432RequestGuardScript','./mentor-request-guard-v432.js?build='+BUILD],
    ['mentorV47ControlsScript','./controls-v47.js?build='+BUILD],
    ['mentorV48OutsideStudyScript','./outside-study-v48.js?build='+BUILD],
    ['mentorV49LayoutScript','./nav-layout-v49.js?build='+BUILD],
    ['mentorV49ResourcesScript','./resources-v49.js?build='+BUILD],
    ['mentorV410StudyTimerScript','./study-timer-v410.js?build='+BUILD],
    ['mentorV411FeedbackCoachScript','./feedback-coach-v411.js?build='+BUILD],
    ['mentorV415OverdueLockScript','./overdue-lock-v415.js?build='+BUILD],
    ['mentorV412EliminationScript','./question-elimination-v412.js?build='+BUILD],
    ['mentorV416TimerReviewManualScript','./timer-review-manual-v416.js?build='+BUILD],
    ['mentorV4141SubtopicFiltersScript','./subtopic-filters-v414.js?build='+BUILD],
    ['mentorV422ReportScript','./report-v422.js?build='+BUILD],
    ['mentorV421QCBanksScript','./qc-banks-v421.js?build='+BUILD],
    ['mentorV420ReviewQuestionsScript','./review-question-stats-v420.js?build='+BUILD],
    ['mentorV418HistoryScript','./learning-history-v418.js?build='+BUILD],
    ['mentorV423AnalyticsScript','./analytics-v423.js?build='+BUILD],
    ['mentorV424PdfScript','./pdf-export-v424.js?build='+BUILD],
    ['mentorV428DailyGoalsScript','./daily-goals-v428.js?build='+BUILD],
    ['mentorV432DailyActionsScript','./daily-actions-v432.js?build='+BUILD],
    ['mentorV429MathFeedbackScript','./math-feedback-v429.js?build='+BUILD],
    ['mentorV430PriorityPlannerScript','./priority-planner-v430.js?build='+BUILD],
    ['mentorV431WeekSummaryScript','./week-summary-v431.js?build='+BUILD]
  ];
  function normalizedHash(value){const h=String(value||'').trim();return h&&h.startsWith('#')?h:'#daily';}
  function loadFrame(hash){frame.src='./mentor-v4.html?build='+BUILD+normalizedHash(hash);}
  function injectModules(){let tries=0;const timer=setInterval(()=>{tries++;try{const d=frame.contentDocument;if(!d)return;if(d.getElementById('appShell')){modules.forEach(([id,src])=>{if(d.getElementById(id))return;const s=d.createElement('script');s.id=id;s.src=src;s.async=false;d.head.appendChild(s);});clearInterval(timer);}}catch(e){}if(tries>200)clearInterval(timer);},180);}
  function downloadBlob(name,blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name||'arquivo';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
  frame.addEventListener('load',injectModules);
  window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data?.type==='mentor-refresh'){const hash=normalizedHash(e.data.hash);history.replaceState(null,'',location.pathname+location.search+hash);loadFrame(hash);return;}if(e.data?.type==='mentor-download-text'){try{downloadBlob(e.data.name,new Blob([String(e.data.content??'')],{type:e.data.mime||'text/plain;charset=utf-8'}));}catch(err){console.error('download-text',err);}return;}if(e.data?.type==='mentor-download-binary'){try{downloadBlob(e.data.name,new Blob([e.data.buffer],{type:e.data.mime||'application/octet-stream'}));}catch(err){console.error('download-binary',err);}}});
  loadFrame(location.hash||'#daily');
})();
</script>
</body>
</html>
