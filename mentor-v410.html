<style>html,body{margin:0;width:100%;height:100%;background:#f4f4f4;overflow:hidden}iframe{display:block;width:100%;height:100dvh;border:0;background:#f4f4f4}</style>

<body>
<iframe id="mentorFrame" src="./mentor-v4.html?build=20260827-v46-safe3#dashboard" title="Mentor IA"></iframe>
<script>
(() => {
  const frame = document.getElementById('mentorFrame');
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    try {
      const d = frame.contentDocument;
      if (!d) return;
      if (d.getElementById('appShell')) {
        const modules = [
          ['mentorV47ControlsScript','./controls-v47.js?build=20260827-1705'],
          ['mentorV48OutsideStudyScript','./outside-study-v48.js?build=20260827-1810'],
          ['mentorV49LayoutScript','./nav-layout-v49.js?build=20260827-1905'],
          ['mentorV49ResourcesScript','./resources-v49.js?build=20260827-1915'],
          ['mentorV410StudyTimerScript','./study-timer-v410.js?build=20260827-2246']
        ];
        modules.forEach(([id,src]) => {
          if (d.getElementById(id)) return;
          const s = d.createElement('script');
          s.id = id;
          s.src = src;
          s.async = false;
          d.head.appendChild(s);
        });
        clearInterval(timer);
      }
    } catch (e) {}
    if (tries > 180) clearInterval(timer);
  }, 250);
})();
</script>
</body>
