<head>

<title>Mentor IA V4.15</title>
<style>html,body{margin:0;width:100%;height:100%;background:#f4f4f4;overflow:hidden}iframe{display:block;width:100%;height:100dvh;border:0;background:#f4f4f4}</style>
</head>
<body>
<iframe id="mentorFrame" src="./mentor-v4.html?build=20260828-v415#daily" title="Mentor IA"></iframe>
<script>
(() => {
  const frame=document.getElementById('mentorFrame');let tries=0;
  const timer=setInterval(()=>{
    tries++;
    try{
      const d=frame.contentDocument;if(!d)return;
      if(d.getElementById('appShell')){
        const modules=[
          ['mentorV47ControlsScript','./controls-v47.js?build=20260828-1035'],
          ['mentorV48OutsideStudyScript','./outside-study-v48.js?build=20260828-1035'],
          ['mentorV49LayoutScript','./nav-layout-v49.js?build=20260828-1035'],
          ['mentorV49ResourcesScript','./resources-v49.js?build=20260828-1035'],
          ['mentorV410StudyTimerScript','./study-timer-v410.js?build=20260828-1035'],
          ['mentorV411FeedbackCoachScript','./feedback-coach-v411.js?build=20260828-1035'],
          ['mentorV415OverdueLockScript','./overdue-lock-v415.js?build=20260828-1035'],
          ['mentorV412EliminationScript','./question-elimination-v412.js?build=20260828-1035'],
          ['mentorV413TimerQuestionsScript','./timer-questions-v412.js?build=20260828-1035'],
          ['mentorV4141SubtopicFiltersScript','./subtopic-filters-v414.js?build=20260828-1035']
        ];
        modules.forEach(([id,src])=>{if(d.getElementById(id))return;const s=d.createElement('script');s.id=id;s.src=src;s.async=false;d.head.appendChild(s);});
        clearInterval(timer);
      }
    }catch(e){}
    if(tries>180)clearInterval(timer);
  },250);
})();
</script>
</body>
</html>
