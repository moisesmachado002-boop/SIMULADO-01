<body>
<iframe id="mentorFrame" src="./mentor-v4.html?build=20260827-v46-safe2#daily" title="Mentor IA"></iframe>
<script>
(() => {
  const frame = document.getElementById('mentorFrame');
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    try {
      const d = frame.contentDocument;
      if (!d) return;
      if (d.getElementById('appShell')) {
        if (!d.getElementById('mentorV47ControlsScript')) {
          const s = d.createElement('script');
          s.id = 'mentorV47ControlsScript';
          s.src = './controls-v47.js?build=20260827-1705';
          s.async = false;
          d.head.appendChild(s);
        }
        if (!d.getElementById('mentorV48OutsideStudyScript')) {
          const s2 = d.createElement('script');
          s2.id = 'mentorV48OutsideStudyScript';
          s2.src = './outside-study-v48.js?build=20260827-1810';
          s2.async = false;
          d.head.appendChild(s2);
        }
        clearInterval(timer);
      }
    } catch (e) {}
    if (tries > 160) clearInterval(timer);
  }, 250);
})();
</script>
</body>
